name: LocalCloud tests
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  localcloud:
    if: github.event_name == 'workflow_dispatch' || vars.LOCALCLOUD_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v5
      - name: Run selected tests on LocalCloud
        run: python3 scripts/localcloud-test.py
