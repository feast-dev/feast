# Sample config for the feast-mcp image.
#
# The image's default CMD is `--config /config/feast_mcp.yaml`, so mount this
# file there -- as a ConfigMap under `config.storage` when deploying with the
# mcp-lifecycle-operator, or with `-v` for a local `docker run`.
#
# Resolution order is CLI > environment > this file > defaults. Note that
# environment outranks the file: setting FEAST_MCP_TRANSPORT in the CR's
# `config.env` will silently override `server.transport` below.

server:
  # stdio cannot serve a port, so it is not deployable under the
  # mcp-lifecycle-operator, whose MCPServer CRD requires `config.port`.
  transport: http           # stdio | http | streamable-http | sse
  host: 0.0.0.0
  port: 8000                # must match spec.config.port on the MCPServer CR
  # workers: 4              # omit for single-process uvicorn;
                            # not supported with sse; http and streamable-http are fine

# At least one of features.url / registry.url is required.
# Under the mcp-lifecycle-operator the MCP server runs in its own Deployment,
# so these must be cluster DNS names -- localhost only works when the MCP
# server runs as a container in the shared Feast pod.
features:
  url: http://feast-example-online.feast.svc.cluster.local:6566

registry:
  url: http://feast-example-registry-rest.feast.svc.cluster.local:6572

timeout: 30

# Logs always go to stderr.
observability:
  level: INFO               # DEBUG | INFO | WARNING | ERROR
  format: json              # text | json

# OAuth state is stored per-node, so `oidc` assumes a single replica: the
# /callback and /token requests may otherwise hit a replica that never saw the
# /authorize. The same applies if the MCPServer CR sets `mcp.stateless: true`,
# which drops the Service's ClientIP affinity.
#
# auth:
#   mode: oidc              # passthrough | kubernetes | oidc
#   discovery_url: https://keycloak.example.com/realms/feast/.well-known/openid-configuration
#   client_id: feast-mcp
#   base_url: https://mcp.example.com
